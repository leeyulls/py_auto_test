name: Daily Morning & Evening Intelligence Briefing

on:
  schedule:
    # 1. 한국 시간(KST) 매일 아침 07:00 수신: UTC 21:55 (KST 06:55)
    - cron: '55 21 * * *'
    # 2. 한국 시간(KST) 매일 저녁 19:00 수신: UTC 09:55 (KST 18:55)
    - cron: '55 9 * * *'
  # GitHub 웹페이지 및 CLI에서 원클릭 수동 실행 버튼 제공
  workflow_dispatch:
    inputs:
      edition:
        description: '실행할 에디션 선택'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

permissions:
  contents: write

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 한글 폰트 및 필수 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk

      - name: Python 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤링, 주가/코인/리서치 분석, 구글 드라이브 동기화 및 브리핑 이메일 발송
        env:
          PYTHONIOENCODING: utf-8
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.edition }}" != "" ] && [ "${{ github.event.inputs.edition }}" != "auto" ]; then
            python main.py --edition=${{ github.event.inputs.edition }}
          else
            python main.py
          fi

      - name: 업데이트된 수집 이력(history.json) 및 마스터 엑셀 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/history.json reports/일자별_누적_데일리_이슈_및_주식_브리핑_마스터.xlsx
          git commit -m "Auto-update collection history & master excel [skip ci]" || echo "No changes to commit"
          git push origin main
