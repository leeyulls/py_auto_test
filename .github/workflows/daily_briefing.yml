name: Daily Morning Stock, Crypto & News Briefing

on:
  schedule:
    # 한국 시간(KST) 매일 아침 07:00에 수신할 수 있도록 UTC 21:55 (06:55 KST)에 실행
    # (GitHub Actions 정각 큐 지연을 방지하여 7시 정각에 메일이 도착하도록 보장)
    - cron: '55 21 * * *'
  # GitHub 웹페이지 및 CLI에서 원클릭 수동 실행 버튼 제공
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤링, 주가/코인 분석, 구글 드라이브 누적 및 07시 브리핑 이메일 발송
        env:
          PYTHONIOENCODING: utf-8
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        run: |
          python main.py

      - name: 업데이트된 수집 이력(history.json) 및 마스터 엑셀 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json reports/일자별_누적_데일리_이슈_및_주식_브리핑_마스터.xlsx
          git commit -m "Auto-update collection history & master excel [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
