name: Daily Morning Stock & News Briefing

on:
  schedule:
    # 매일 UTC 00:00 = 한국 시간(KST) 오전 09:00
    - cron: '0 0 * * *'
  # GitHub 웹페이지에서 원클릭 수동 실행 버튼 제공
  workflow_dispatch:

jobs:
  daily-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤링, 주가 분석 및 브리핑 이메일 발송
        env:
          PYTHONIOENCODING: utf-8
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py

      - name: 업데이트된 수집 이력(history.json) 저장
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Auto-update collection history [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
